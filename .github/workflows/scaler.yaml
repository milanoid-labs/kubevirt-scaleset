name: scaler

# Tests the Go code and builds the scaler image. PRs test and build only; main also pushes
# to ghcr.io/milanoid-labs/kubevirt-scaleset.
on:
  pull_request:
    branches: [main]
    paths: &paths
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/scaler.yaml'
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scaler-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # One job, so the dependencies (Kubernetes, KubeVirt) compile once: vet, test and build
    # share Go's build cache, which setup-go saves after a green run (first run ~15 min,
    # then a few). Everything compiles in the runner container (4Gi), not in dind (1Gi).
    runs-on: homelab-runners
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      # Static binary; and the same setting for vet, test and build keeps one cache.
      CGO_ENABLED: "0"
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"

      - name: vet
        run: go vet ./...

      # No -race: it builds everything a second time; run it locally (go test -race ./...).
      - name: test
        run: go test ./...

      - name: tag
        id: tag
        run: echo "tag=$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Same flags as vet/test (no -trimpath), so it reuses their compiled packages.
      - name: build binary
        env:
          GOOS: linux
          GOARCH: amd64
        run: go build -ldflags "-s -w -X main.version=${{ steps.tag.outputs.tag }}" -o out/scaler ./cmd/scaler

      - name: set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: log in to ghcr
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Target prebuilt: only copies out/scaler onto distroless, nothing compiles in dind.
      - name: build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: prebuilt
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Scaler image"
            echo '```'
            echo "ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.tag }}@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
