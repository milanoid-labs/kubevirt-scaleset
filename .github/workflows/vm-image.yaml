name: VM image

# Builds the runner VM disk (vm-image/) and publishes it as a KubeVirt containerDisk to the
# homelab Nexus. PRs build only (no secrets, nothing pushed); main builds and pushes. The
# weekly run rebuilds main unchanged, so Ubuntu, Docker and apt packages stay current.
on:
  pull_request:
    branches: [main]
    paths:
      - 'vm-image/**'
      - '.github/workflows/vm-image.yaml'
  push:
    branches: [main]
    paths:
      - 'vm-image/**'
      - '.github/workflows/vm-image.yaml'
  schedule:
    - cron: '0 3 * * 1'   # Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vm-image-${{ github.ref }}
  cancel-in-progress: true

# Renovate bumps CRANE_VERSION; vm-image/update-checksums.sh rewrites CRANE_SHA256.
env:
  CRANE_VERSION: "0.22.1"
  CRANE_SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0

jobs:
  build:
    # On the LAN, so it reaches Nexus. No /dev/kvm in the pods: libguestfs emulates (~75 min).
    runs-on: homelab-runners
    timeout-minutes: 150
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Runs in the runner container (4Gi), not dind (1Gi): the helper VM alone takes 2Gi.
      # linux-image-virtual: the kernel libguestfs boots. isc-dhcp-client: the DHCP client
      # libguestfs' helper VM is built with (apt would pick dhcpcd-base, which it ignores).
      - name: install build tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            guestfs-tools linux-image-virtual qemu-utils isc-dhcp-client

      - name: build disk
        run: vm-image/build.sh

      # dind is fine here: it only packs the disk file into an image.
      - name: build containerDisk
        run: |
          cp vm-image/out/disk.qcow2 vm-image/containerdisk/
          docker build --platform linux/amd64 \
            --label org.opencontainers.image.source="${{ github.server_url }}/${{ github.repository }}" \
            --label org.opencontainers.image.revision="${{ github.sha }}" \
            --label io.homelab.runner-vm.versions="$(paste -sd ';' vm-image/out/versions.txt)" \
            -t homelab-runner-vm:ci vm-image/containerdisk
          docker save homelab-runner-vm:ci -o vm-image/out/image.tar
          ls -lh vm-image/out/

      # crane, not docker push: dind only does HTTPS, Nexus is plain HTTP (--insecure).
      - name: install crane
        if: github.event_name != 'pull_request'
        run: |
          curl -fsSL -o /tmp/crane.tgz \
            "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_SHA256}  /tmp/crane.tgz" | sha256sum -c --quiet
          sudo tar -xzf /tmp/crane.tgz -C /usr/local/bin crane

      - name: push to Nexus
        if: github.event_name != 'pull_request'
        env:
          REGISTRY: ${{ vars.NEXUS_REGISTRY }}
          USERNAME: ${{ vars.NEXUS_PUSH_USERNAME }}
          PASSWORD: ${{ secrets.NEXUS_PUSH_PASSWORD }}
        run: |
          # docker-hosted is ALLOW_ONCE: run number + attempt keep re-runs from colliding.
          image="${REGISTRY}/docker-hosted/homelab-runner-vm"
          tag="$(date -u +%Y%m%d)-${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "$PASSWORD" | crane auth login "$REGISTRY" -u "$USERNAME" --password-stdin
          crane push --insecure vm-image/out/image.tar "${image}:${tag}"
          digest=$(crane digest --insecure "${image}:${tag}")
          {
            echo "### Runner VM image"
            echo '```'
            echo "${image}:${tag}@${digest}"
            echo '```'
            echo '```'
            cat vm-image/out/versions.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
